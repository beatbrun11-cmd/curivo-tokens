# Was hier durchgeht, geht in ALLE Curivo-Module gleichzeitig.
#
# Ein Fehler in diesen Werten ist nicht an einer Stelle falsch, sondern
# ueberall. Darum laeuft die Pruefung bei jedem Push und bei jedem Tag --
# und nicht nur auf dem Rechner dessen, der gerade etwas aendert.
name: Pruefen

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Bauen
        # Die Verbraucher bauen das Paket bei der Installation. Schlaegt es
        # hier fehl, schlaegt dort jede Installation fehl.
        run: npm run build

      - name: Pruefen
        run: npm test

      - name: Kontraste messen
        # Der eigentliche Grund fuer diesen Lauf: WCAG 2.1 verlangt 4.5 zu 1
        # fuer Text und 3.0 fuer Raender an Bauteilen.
        #
        # Halbtransparenz ist hier ausgeschlossen, nicht komponiert: das Skript
        # lehnt jeden Wert ab, der nicht `#RRGGBB` ist. Wer Transparenz
        # einfuehren will, muss zuerst die Komposition nachruesten -- sonst
        # misst der Lauf eine Farbe, die nie zu sehen war.
        run: node scripts/kontraste.mjs

      - name: Traegt das Tag die Fassung, die im Baum steht?
        # Ein Tag entsteht ausserhalb dieses Laufs. `git tag v1.0.4` auf einem
        # Baum, der 1.0.3 sagt, ergaebe sonst einen gruenen Lauf -- und der
        # Fehler faellt erst beim Verbraucher auf, in einem fremden Repo.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          im_tag="${GITHUB_REF_NAME#v}"
          im_baum=$(node -p "require('./package.json').version")
          if [ "$im_tag" != "$im_baum" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, aber package.json sagt $im_baum."
            exit 1
          fi
          echo "Tag und Fassung stimmen ueberein: $im_baum"
